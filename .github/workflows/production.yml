# Erzeugt und qualifiziert bei jedem Push alle Produktionsdaten.
# Ergebnis: Artefakt "WortUhr-Produktion" (05_Production mit Berichten + freigegebenen Dateien)
#           und Artefakt "WortUhr-Firmware" (nur Build-Pruefung mit Test-Schluesseln).
name: Produktionsdaten

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  pcb:
    name: Platine (KiCad 10, JLCPCB)
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0-full   # inkl. 3D-Modelle fuer den STEP-Export
      options: --user root           # Image laeuft sonst als "kicad" und darf nicht in /__w/_temp schreiben
    steps:
      - uses: actions/checkout@v5
      - name: Qualifikation und Fertigungsdaten
        env:
          KICAD_CLI: kicad-cli
        run: |
          mkdir -p stage
          python3 05_Production/tools/qualify_pcb.py stage
      - name: Bilder der Platine (3D-Ansichten, Lagen-PDF, Kupfer-SVG)
        env:
          KICAD_CLI: kicad-cli
        run: python3 02_Electronics/KiCad/tools/pcb_images.py pcb-bilder
      - uses: actions/upload-artifact@v6
        with:
          name: stage-pcb
          path: stage
      - uses: actions/upload-artifact@v6
        with:
          name: WortUhr-Platine-Bilder
          path: pcb-bilder

  mechanik:
    name: Laser- und 3D-Druckteile (FreeCAD)
    runs-on: ubuntu-latest
    env:
      FREECAD_URL: https://github.com/FreeCAD/FreeCAD/releases/download/1.1.2/FreeCAD_1.1.2-Linux-x86_64-py311.AppImage
    steps:
      - uses: actions/checkout@v5
      - name: FreeCAD bereitstellen
        run: |
          curl -sSL -o freecad.AppImage "$FREECAD_URL"
          chmod +x freecad.AppImage
          ./freecad.AppImage --appimage-extract > /dev/null
      - name: Qualifikation
        run: |
          mkdir -p stage
          for s in qualify_laser.py qualify_print.py; do
            ./squashfs-root/usr/bin/freecadcmd -c "STAGE='$PWD/stage'; ROOT='$PWD'; exec(open('05_Production/tools/$s', encoding='utf-8').read())"
          done
          test -f stage/laser_result.json && test -f stage/print_result.json
      - name: Render-Netze exportieren
        run: WORTUHR_MESH_OUT="$PWD/meshes" ./squashfs-root/usr/bin/freecadcmd 04_Rendering/export_meshes.py
      - uses: actions/upload-artifact@v6
        with:
          name: stage-mechanik
          path: stage
      - uses: actions/upload-artifact@v6
        with:
          name: meshes
          path: meshes

  firmware:
    name: Firmware (ESPHome) und WLED
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: ESPHome installieren
        run: pip install "esphome==2026.10.2"
      - name: Qualifikation (inkl. Build)
        run: |
          mkdir -p stage
          python 05_Production/tools/qualify_firmware.py stage
      - uses: actions/upload-artifact@v6
        with:
          name: stage-firmware
          path: stage

  rendering:
    name: Rendering (Blender, Cycles)
    runs-on: ubuntu-latest
    needs: [mechanik]
    env:
      BLENDER_URL: https://download.blender.org/release/Blender5.2/blender-5.2.3-linux-x64.tar.xz
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: meshes
          path: 04_Rendering/meshes          # aktuelle Netze aus dem FreeCAD-Modell
      - name: Blender bereitstellen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 libxxf86vm1 libxfixes3 > /dev/null
          curl -sSL "$BLENDER_URL" | tar -xJ
          mv blender-5.2.3-linux-x64 blender
      - name: Rendern (schraeg, frontal, blau im Dunkeln)
        run: |
          mkdir -p renders
          R="./blender/blender -b -P 04_Rendering/render_wortuhr.py -- --samples 64 --res 1200x1200"
          $R --view angle --out "$PWD/renders/WortUhr_angle.png"
          $R --view front --out "$PWD/renders/WortUhr_front.png"
          $R --view front --color blau --dark 1 --out "$PWD/renders/WortUhr_front_blau_dunkel.png"
          ls renders/*.png | wc -l | grep -q 3
      - uses: actions/upload-artifact@v6
        with:
          name: WortUhr-Renderings
          path: renders

  bericht:
    name: Berichte und Freigabe
    runs-on: ubuntu-latest
    needs: [pcb, mechanik, firmware]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: stage
          pattern: stage-*
          merge-multiple: true
      - name: Berichte schreiben, freigegebene Daten kopieren
        run: python3 05_Production/tools/make_reports.py stage
      - uses: actions/upload-artifact@v6
        with:
          name: WortUhr-Produktion
          path: 05_Production
      - uses: actions/upload-artifact@v6
        with:
          name: WortUhr-Firmware
          path: stage/Firmware
